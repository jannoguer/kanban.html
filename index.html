<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLANNING BOARD</title>
<link rel="stylesheet" href="styles.css">
<script src="script.js" defer></script>
</head>
<body>
<nav>
  <h1><input id="board-name" aria-label="Board name" maxlength="60" autocomplete="off" spellcheck="false"></h1>
  <div>
    <input type="search" id="search" placeholder="Search (/)" aria-label="Search tasks" autocomplete="off">
    <button class="switch" id="theme" aria-label="Toggle theme">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <div class="group">
      <button class="icon" id="export" aria-label="Export tasks">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
      </button>
      <button class="icon" id="import" aria-label="Import tasks">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
      </button>
    </div>
    <input type="file" id="import-file" accept=".json,application/json" hidden>
    <button class="icon" id="add" aria-label="Add task">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
</nav>
<main></main>
<dialog>
  <form method="dialog">
    <h3></h3>
    <div class="field"><span id="title-label">Title</span><input name="title" aria-labelledby="title-label" required pattern=".*\S.*" autocomplete="off"></div>
    <div class="field"><span id="description-label">Description</span><textarea name="description" aria-labelledby="description-label"></textarea></div>
    <div class="field"><span id="status-label">Status</span><select name="status" aria-labelledby="status-label"></select></div>
    <div class="actions">
      <button type="button" class="danger" id="delete">Delete</button>
      <button class="primary">Save</button>
      <button type="button" id="cancel">Cancel</button>
    </div>
  </form>
</dialog>
</body>
</html>
